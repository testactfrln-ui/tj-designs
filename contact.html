<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0a0c; font-family: 'Inter', sans-serif; }
  a { color: #f2f1ec; text-decoration: none; position: relative; }
  a::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 100%; height: 1px; background: #e2622a; transform: scaleX(0); transform-origin: left; transition: transform .3s ease; }
  a:hover::after { transform: scaleX(1); }

  /* ---------- MAP BACKGROUND (fixed, sits behind everything) ---------- */
  .map-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: #0a0a0c;
  }

  #map-root { position: absolute; inset: 0; }

  .map-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 60% 45%, transparent 30%, rgba(10,10,12,.92) 100%);
  }

  .map-contrast {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg, rgba(10,10,12,.82) 0%, rgba(10,10,12,.5) 38%, rgba(10,10,12,.15) 60%, transparent 78%);
  }

  .grain {
    position: absolute;
    inset: -20%;
    pointer-events: none;
    opacity: .05;
    mix-blend-mode: overlay;
  }

  /* ---------- PAGE CONTENT (scrolls over the fixed map) ---------- */
  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .page-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2rem 3rem;
  }

  .page-nav .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    color: #f2f1ec;
  }

  .page-nav .back-link {
    font-size: 0.85rem;
    color: #999790;
  }

  .contact-wrap {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 4rem;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 3rem 4rem;
    width: 100%;
  }

  .kicker {
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #999790;
    margin-bottom: 1rem;
  }

  .contact-copy h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.6rem, 5vw, 4.2rem);
    line-height: 1.08;
    letter-spacing: 0.01em;
    color: #f2f1ec;
    margin: 0 0 1.2rem;
  }

  .contact-copy .sub {
    font-size: 1rem;
    line-height: 1.6;
    color: #b8b6ae;
    max-width: 420px;
    margin: 0 0 1.6rem;
  }

  .direct-email {
    font-size: 0.95rem;
    color: #e2622a;
  }

  /* ---------- FORM CARD ---------- */
  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
    background: rgba(13, 13, 12, 0.6);
    border: 1px solid #262520;
    border-radius: 14px;
    padding: 2rem;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .field label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #999790;
    margin-bottom: 0.4rem;
  }

  .input {
    width: 100%;
    background: rgba(10, 10, 12, 0.6);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0.65rem 0.8rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: #f2f1ec;
    transition: border-color 0.25s ease;
  }

  .input::placeholder { color: #6b6a63; }
  .input:focus { outline: none; border-color: #e2622a; }
  textarea.input { resize: vertical; min-height: 90px; }

  /* ---------- CTA BUTTON (same language as the homepage) ---------- */
  .cta-btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 30px; border-radius: 999px; background: #14130f; border: 1px solid #333;
    color: #f2f1ec; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px;
    cursor: pointer; overflow: hidden; isolation: isolate; transition: border-color .3s, box-shadow .3s;
    margin-top: 0.4rem;
  }
  .cta-btn::before {
    content: ""; position: absolute; inset: -1px; border-radius: 999px; padding: 1px;
    background: linear-gradient(135deg, #e2622a, transparent 45%, transparent 55%, #e2622a);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .3s ease; z-index: 0; pointer-events: none;
  }
  .cta-btn:hover::before { opacity: 1; }
  .cta-btn:hover { box-shadow: 0 0 28px rgba(226,98,42,.32); border-color: #4a2f22; }
  .cta-btn .sweep {
    content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.14), transparent);
    transform: skewX(-20deg); transition: left .7s ease; pointer-events: none;
  }
  .cta-btn:hover .sweep { left: 130%; }
  .cta-dot { width: 6px; height: 6px; border-radius: 50%; background: #e2622a; box-shadow: 0 0 8px #e2622a; animation: pulse 1.8s ease-in-out infinite; flex-shrink: 0; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  .cta-btn:disabled { opacity: 0.6; cursor: default; }

  .form-status {
    font-size: 0.8rem;
    color: #e2622a;
    display: none;
    margin-top: -0.4rem;

    .contact-wrap { grid-template-columns: 1fr; gap: 2.5rem; padding: 1.5rem; }
    .page-nav { padding: 1.5rem; }

<body>

</div>

<script>
fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r => r.json()).then(us => {
  const width = window.innerWidth, height = window.innerHeight;
  const svg = d3.select('#map-root').append('svg')
    .attr('width', '100%').attr('height', '100%')
    .attr('viewBox', `0 0 ${width} ${height}`).style('display', 'block');

  const nation = topojson.feature(us, us.objects.nation);
  const stateMesh = topojson.mesh(us, us.objects.states, (a, b) => a !== b);

  const projection = d3.geoAlbersUsa().fitSize([width * 0.82, height * 0.82], nation);
  const [tx, ty] = projection.translate();
  projection.translate([tx + width * 0.1, ty + height * 0.02]);
  const path = d3.geoPath(projection);

  svg.append('path').datum(nation).attr('d', path)
    .attr('fill', '#0d0d0c').attr('stroke', '#333').attr('stroke-width', 1);
  svg.append('path').datum(stateMesh).attr('d', path)
    .attr('fill', 'none').attr('stroke', '#1e1d1a').attr('stroke-width', 1);

  const defs = svg.append('defs');
  const glow = defs.append('filter').attr('id', 'cityGlow').attr('x', '-300%').attr('y', '-300%').attr('width', '700%').attr('height', '700%');
  glow.append('feGaussianBlur').attr('stdDeviation', 6);

  const cities = [
    { name: 'New York', lat: 40.7128, lon: -74.0060, tz: 'America/New_York' },
    { name: 'Boston', lat: 42.3601, lon: -71.0589, tz: 'America/New_York' },
    { name: 'Washington DC', lat: 38.9072, lon: -77.0369, tz: 'America/New_York' },
    { name: 'Miami', lat: 25.7617, lon: -80.1918, tz: 'America/New_York' },
    { name: 'Atlanta', lat: 33.7490, lon: -84.3880, tz: 'America/New_York' },
    { name: 'Philadelphia', lat: 39.9526, lon: -75.1652, tz: 'America/New_York' },
    { name: 'Detroit', lat: 42.3314, lon: -83.0458, tz: 'America/New_York' },
    { name: 'Chicago', lat: 41.8781, lon: -87.6298, tz: 'America/Chicago' },
    { name: 'Dallas', lat: 32.7767, lon: -96.7970, tz: 'America/Chicago' },
    { name: 'Houston', lat: 29.7604, lon: -95.3698, tz: 'America/Chicago' },
    { name: 'Minneapolis', lat: 44.9778, lon: -93.2650, tz: 'America/Chicago' },
    { name: 'New Orleans', lat: 29.9511, lon: -90.0715, tz: 'America/Chicago' },
    { name: 'Kansas City', lat: 39.0997, lon: -94.5786, tz: 'America/Chicago' },
    { name: 'Nashville', lat: 36.1627, lon: -86.7816, tz: 'America/Chicago' },
    { name: 'Denver', lat: 39.7392, lon: -104.9903, tz: 'America/Denver' },
    { name: 'Salt Lake City', lat: 40.7608, lon: -111.8910, tz: 'America/Denver' },
    { name: 'Phoenix', lat: 33.4484, lon: -112.0740, tz: 'America/Phoenix' },
    { name: 'Seattle', lat: 47.6062, lon: -122.3321, tz: 'America/Los_Angeles' },
    { name: 'Portland', lat: 45.5152, lon: -122.6784, tz: 'America/Los_Angeles' },
    { name: 'San Francisco', lat: 37.7749, lon: -122.4194, tz: 'America/Los_Angeles' },
    { name: 'Los Angeles', lat: 34.0522, lon: -118.2437, tz: 'America/Los_Angeles' },
    { name: 'San Diego', lat: 32.7157, lon: -117.1611, tz: 'America/Los_Angeles' },
    { name: 'Las Vegas', lat: 36.1699, lon: -115.1398, tz: 'America/Los_Angeles' },
    { name: 'Anchorage', lat: 61.2181, lon: -149.9003, tz: 'America/Anchorage' },
    { name: 'Honolulu', lat: 21.3069, lon: -157.8583, tz: 'Pacific/Honolulu' },
    { name: 'Baltimore', lat: 39.2904, lon: -76.6122, tz: 'America/New_York' },
    { name: 'Charlotte', lat: 35.2271, lon: -80.8431, tz: 'America/New_York' },
    { name: 'Raleigh', lat: 35.7796, lon: -78.6382, tz: 'America/New_York' },
    { name: 'Tampa', lat: 27.9506, lon: -82.4572, tz: 'America/New_York' },
    { name: 'Orlando', lat: 28.5383, lon: -81.3792, tz: 'America/New_York' },
    { name: 'Jacksonville', lat: 30.3322, lon: -81.6557, tz: 'America/New_York' },
    { name: 'Pittsburgh', lat: 40.4406, lon: -79.9959, tz: 'America/New_York' },
    { name: 'Buffalo', lat: 42.8864, lon: -78.8784, tz: 'America/New_York' },
    { name: 'Columbus', lat: 39.9612, lon: -82.9988, tz: 'America/New_York' },
    { name: 'Cleveland', lat: 41.4993, lon: -81.6944, tz: 'America/New_York' },
    { name: 'Cincinnati', lat: 39.1031, lon: -84.5120, tz: 'America/New_York' },
    { name: 'Richmond', lat: 37.5407, lon: -77.4360, tz: 'America/New_York' },
    { name: 'Providence', lat: 41.8240, lon: -71.4128, tz: 'America/New_York' },
    { name: 'Hartford', lat: 41.7658, lon: -72.6734, tz: 'America/New_York' },
    { name: 'Milwaukee', lat: 43.0389, lon: -87.9065, tz: 'America/Chicago' },
    { name: 'St. Louis', lat: 38.6270, lon: -90.1994, tz: 'America/Chicago' },
    { name: 'Indianapolis', lat: 39.7684, lon: -86.1581, tz: 'America/New_York' },
    { name: 'Memphis', lat: 35.1495, lon: -90.0490, tz: 'America/Chicago' },
    { name: 'Oklahoma City', lat: 35.4676, lon: -97.5164, tz: 'America/Chicago' },
    { name: 'Tulsa', lat: 36.1540, lon: -95.9928, tz: 'America/Chicago' },

    { name: 'Austin', lat: 30.2672, lon: -97.7431, tz: 'America/Chicago' },
    { name: 'Madison', lat: 43.0731, lon: -89.4012, tz: 'America/Chicago' },
    { name: 'Omaha', lat: 41.2565, lon: -95.9345, tz: 'America/Chicago' },
    { name: 'Des Moines', lat: 41.5868, lon: -93.6250, tz: 'America/Chicago' },
    { name: 'Little Rock', lat: 34.7465, lon: -92.2896, tz: 'America/Chicago' },
    { name: 'Baton Rouge', lat: 30.4515, lon: -91.1871, tz: 'America/Chicago' },
    { name: 'Albuquerque', lat: 35.0844, lon: -106.6504, tz: 'America/Denver' },
    { name: 'Boise', lat: 43.6150, lon: -116.2023, tz: 'America/Boise' },
    { name: 'Billings', lat: 45.7833, lon: -108.5007, tz: 'America/Denver' },

    { name: 'Spokane', lat: 47.6588, lon: -117.4260, tz: 'America/Los_Angeles' },
    { name: 'Bakersfield', lat: 35.3733, lon: -119.0187, tz: 'America/Los_Angeles' }
  ];

  const nodes = svg.append('g').selectAll('g').data(cities).enter().append('g')
    .attr('transform', d => { const p = projection([d.lon, d.lat]); return `translate(${p[0]},${p[1]})`; });

  nodes.append('circle').attr('class', 'glow').attr('r', 0).attr('filter', 'url(#cityGlow)');
  nodes.append('circle').attr('class', 'core').attr('r', 0);

  function hashSeed(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return ((h % 1000) + 1000) % 1000 / 1000; }

  function getHour(tz) {
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date());
    const h = parseInt(parts.find(p => p.type === 'hour').value) % 24;
    const m = parseInt(parts.find(p => p.type === 'minute').value);
    return h + m / 60;
  }

  function nightness(h) {
    if (h >= 20.25 || h < 6.75) return 1;
    if (h >= 19.75 && h < 20.25) return (h - 19.75) / 0.5;
    if (h >= 6.75 && h < 7.25) return 1 - (h - 6.75) / 0.5;
    return 0;
  }

  const dayCore = '#e2622a', nightCore = '#a9d8ff';
  const dayGlow = '#7a3315', nightGlow = '#2f7fe0';
  const coreColor = d3.interpolateRgb(dayCore, nightCore);
  const glowColor = d3.interpolateRgb(dayGlow, nightGlow);

  function update() {
    nodes.each(function (d) {
      const n = nightness(getHour(d.tz));
      const variance = 0.7 + hashSeed(d.name) * 0.6;
      const eff = Math.max(0.15, Math.min(1, n * variance));
      const eased = n;
      const g = d3.select(this);
      g.select('circle.core').attr('r', 2 + eff * 3.5).attr('opacity', 0.55 + eff * 0.45).attr('fill', coreColor(eased));
      g.select('circle.glow').attr('r', 4 + eff * 13).attr('opacity', 0.35 + eff * 0.45).attr('fill', glowColor(eased));
    });
  }
  update();
  setInterval(update, 30000);
});

// ---------- CONTACT FORM SUBMISSION (Supabase) ----------
const sb = supabase.createClient(
  'https://ijzdtnkdnzlkyfqdcoan.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqemR0bmtkbnpsa3lmcWRjb2FuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNDQ5MTUsImV4cCI6MjEwNjYyMDkxNX0.UjNVYavdZZhNs4dCXzLiRzF57SXXU4FRs5wBe_D63sM'
);

const contactForm = document.getElementById('contactForm');
const sendBtn = document.getElementById('sendBtn');
const btnText = sendBtn.querySelector('.btn-text');
const formStatus = document.getElementById('formStatus');

contactForm.addEventListener('submit', async function (e) {
  e.preventDefault();
  formStatus.style.display = 'none';
  sendBtn.disabled = true;
  btnText.textContent = 'Starting...';

  try {
    const formData = new FormData(contactForm);
    const payload = Object.fromEntries(formData);

    const { error } = await sb.from('contact_submissions').insert({
      name: payload.name,
      email: payload.email,
      project_type: payload.project_type || null,
      details: payload.details || null
    });

    if (error) throw new Error(error.message);

    btnText.textContent = 'Sent!';
    setTimeout(() => {
      window.location.href = '/';
    }, 900);
  } catch (err) {
    formStatus.textContent = "Couldn't send that — try again or email me directly.";
    formStatus.style.display = 'block';
    sendBtn.disabled = false;
    btnText.textContent = 'Begin the build';
  }
});

</script>
